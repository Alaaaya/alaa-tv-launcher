name: Build launcher
on:
  workflow_dispatch:
  push:
    branches: [main, feat/look-2.0]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - run: ./gradlew :app:testDebugUnitTest --no-daemon --tests '*DiscoverTest' --tests '*WebOsTest' --tests '*LauncherTest' --tests '*LiteBitmapsTest'
      - run: timeout 200 ./gradlew :app:testDebugUnitTest --no-daemon --tests '*LookTest.lookPageAndPersistence' -i 2>&1 | grep -E "STEP|PASSED|FAILED|BUILD" || true
      - run: timeout 200 ./gradlew :app:testDebugUnitTest --no-daemon --tests '*LookTest.homeCinemaDusk' -i 2>&1 | grep -E "PASSED|FAILED|BUILD" || true
      - run: timeout 200 ./gradlew :app:testDebugUnitTest --no-daemon --tests '*LookTest.homeOceanForest' -i 2>&1 | grep -E "PASSED|FAILED|BUILD" || true
      - run: timeout 200 ./gradlew :app:testDebugUnitTest --no-daemon --tests '*LookTest.homeSoftOutline' -i 2>&1 | grep -E "PASSED|FAILED|BUILD" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alaa-tv-build-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/screenshots/*.png
            app/build/reports/tests/testDebugUnitTest/
